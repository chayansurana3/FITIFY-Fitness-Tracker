<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0f1a" />
    <title>FITIFY | Create account</title>
    <link rel="icon" href="./favicon-32x32.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@800&family=Instrument+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link rel="stylesheet" href="./indexCSS.css" />
    <link rel="stylesheet" href="./accountCSS.css" />
  </head>
  <body class="account-page">
    <header><div data-navbar></div></header>
    <main class="account-main">
      <section class="auth-intro">
        <p class="account-eyebrow">A FRESH START</p>
        <h1>Make space for <span>progress.</span></h1>
        <p>Create your private account. You can add your fitness details later, whenever you’re ready.</p>
      </section>
      <section class="auth-card" aria-labelledby="auth-title">
        <div class="auth-card-heading"><span class="account-icon" aria-hidden="true">&#10010;</span><div><p class="account-eyebrow">GET STARTED</p><h2 id="auth-title">Create your account</h2></div></div>
        <form id="auth-form" data-auth-mode="register" novalidate>
          <div class="account-field"><label for="displayName">Your name</label><input id="displayName" name="displayName" type="text" autocomplete="name" minlength="2" maxlength="80" placeholder="How should we call you?" required /></div>
          <div class="account-field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required /></div>
          <div class="account-field"><label for="password">Create a password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="At least 12 characters" required /><small>Use at least 12 characters.</small></div>
          <button class="account-primary" id="auth-submit" type="submit">Create account <span aria-hidden="true">&#8594;</span></button>
          <p class="account-status" id="auth-status" role="status" aria-live="polite"></p>
        </form>
        <p class="auth-switch">Already have an account? <a href="./account.html">Sign in</a></p>
        <p class="account-privacy-note"><i aria-hidden="true">&#128274;</i> Your dashboard is private to your account.</p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="./components/navbar.js"></script>
    <script src="./auth-ui.js"></script>
  </body>
</html>
