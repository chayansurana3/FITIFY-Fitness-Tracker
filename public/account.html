<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0f1a" />
    <title>FITIFY | Sign in</title>
    <link rel="icon" href="./favicon-32x32.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@800&family=Instrument+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link rel="stylesheet" href="./indexCSS.css" />
    <link rel="stylesheet" href="./accountCSS.css" />
  </head>
  <body class="account-page">
    <header><div data-navbar></div></header>
    <main class="account-main">
      <section class="auth-intro">
        <p class="account-eyebrow">YOUR PRIVATE FITIFY SPACE</p>
        <h1>Progress that’s <span>yours.</span></h1>
        <p>Sign in to keep your fitness profile and personal dashboard together.</p>
      </section>
      <section class="auth-card" aria-labelledby="auth-title">
        <div class="auth-card-heading"><span class="account-icon" aria-hidden="true">&#8594;</span><div><p class="account-eyebrow">WELCOME BACK</p><h2 id="auth-title">Sign in to FITIFY</h2></div></div>
        <form id="auth-form" data-auth-mode="login" novalidate>
          <div class="account-field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required /></div>
          <div class="account-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required /></div>
          <button class="account-primary" id="auth-submit" type="submit">Sign in <span aria-hidden="true">&#8594;</span></button>
          <button class="account-text-button" id="resend-verification" type="button" hidden>Resend verification email</button>
          <p class="account-status" id="auth-status" role="status" aria-live="polite"></p>
        </form>
        <p class="auth-switch auth-forgot"><a href="./forgot-password.html">Forgot password?</a></p>
        <p class="auth-switch">New to FITIFY? <a href="./register.html">Create an account</a></p>
        <p class="account-privacy-note"><i aria-hidden="true">&#128274;</i> Your dashboard is private to your account.</p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="./components/navbar.js"></script>
    <script src="./auth-ui.js"></script>
  </body>
</html>
