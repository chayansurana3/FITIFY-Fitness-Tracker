<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#0b0f1a" /><title>FITIFY | Choose a new password</title><link rel="icon" href="./favicon-32x32.png" type="image/png" /><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@800&family=Instrument+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" /><link rel="stylesheet" href="./indexCSS.css" /><link rel="stylesheet" href="./accountCSS.css" /></head>
<body class="account-page"><header><div data-navbar></div></header><main class="account-main"><section class="auth-intro"><p class="account-eyebrow">A SECURE RESET</p><h1>Choose a new <span>password.</span></h1><p>Use at least 12 characters. Your other signed-in sessions will be ended.</p></section><section class="auth-card"><div class="auth-card-heading"><span class="account-icon" aria-hidden="true">✳</span><div><p class="account-eyebrow">ACCOUNT SECURITY</p><h2>Set a new password</h2></div></div><form id="reset-form"><div class="account-field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required /></div><div class="account-field"><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required /></div><button class="account-primary" id="reset-submit" type="submit">Update password <span aria-hidden="true">→</span></button><p class="account-status" id="reset-status" role="status" aria-live="polite"></p></form><p class="auth-switch"><a href="./account.html">Back to sign in</a></p></section></main><script src="./components/navbar.js"></script><script src="./account-recovery.js"></script></body></html>
